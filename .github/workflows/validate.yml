name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install validators' dependencies
        run: pip install nbformat
      - name: Validate notebook cell structure
        run: python utils/validate_cells.py
      - name: Validate prose style
        run: python utils/validate_style.py

  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pytest
        run: pip install pytest nbformat
      - name: Run smoke tests
        run: pytest tests/ -q
