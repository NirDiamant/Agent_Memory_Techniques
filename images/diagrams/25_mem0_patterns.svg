<svg viewBox="0 0 1400 680" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="gApp" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#667eea"/><stop offset="100%" style="stop-color:#764ba2"/></linearGradient>
    <linearGradient id="gLLM" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#f093fb"/><stop offset="100%" style="stop-color:#f5576c"/></linearGradient>
    <linearGradient id="gAdd" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#11998e"/><stop offset="100%" style="stop-color:#38ef7d"/></linearGradient>
    <linearGradient id="gSearch" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#FFB75E"/><stop offset="100%" style="stop-color:#ED8F03"/></linearGradient>
    <linearGradient id="gStore" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#4f46e5"/><stop offset="100%" style="stop-color:#7c3aed"/></linearGradient>
    <linearGradient id="gOps" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#4facfe"/><stop offset="100%" style="stop-color:#00f2fe"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="1.5" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.18"/></filter>
    <filter id="soft"><feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.12"/></filter>
    <marker id="arrMain" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#2563eb"/></marker>
    <marker id="arrAdd" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#059669"/></marker>
    <marker id="arrSearch" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#d97706"/></marker>
    <marker id="arrStore" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#7c3aed"/></marker>
    <marker id="arrResult" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#d946ef"/></marker>
  </defs>

  <rect width="1400" height="680" fill="#f8f9fa"/>
  <text x="700" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f2937">Mem0 Patterns</text>
  <text x="700" y="62" text-anchor="middle" font-size="13" fill="#6b7280">A managed memory layer that uses LLM extraction, deduplication, and scoped vector search. The app calls memory.add() and memory.search().</text>

  <!-- App panel -->
  <rect x="40" y="100" width="440" height="340" rx="14" fill="url(#gApp)" opacity="0.12" filter="url(#shadow)"/>
  <rect x="40" y="100" width="440" height="40" rx="14" fill="url(#gApp)" opacity="0.95"/>
  <text x="260" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="white">🤖  Agent / Application</text>

  <!-- User message -->
  <g><rect x="70" y="160" width="180" height="60" rx="12" fill="url(#gApp)" opacity="0.92" filter="url(#soft)"/><text x="160" y="186" text-anchor="middle" font-size="13" font-weight="bold" fill="white">👤  User Message</text><text x="160" y="204" text-anchor="middle" font-size="11" fill="#e9e3ff">new conversation turn</text></g>

  <!-- Agent generates response -->
  <g><rect x="70" y="260" width="380" height="70" rx="12" fill="url(#gLLM)" opacity="0.92" filter="url(#soft)"/><text x="260" y="290" text-anchor="middle" font-size="14" font-weight="bold" fill="white">✨  Agent Generates Response</text><text x="260" y="310" text-anchor="middle" font-size="11" fill="#ffe4f1">memories injected into system prompt</text></g>

  <!-- Response to user -->
  <g><rect x="70" y="370" width="180" height="50" rx="12" fill="white" stroke="#2563eb" stroke-width="2" filter="url(#soft)"/><text x="160" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">↪  Response</text></g>

  <!-- Mem0 Memory Layer panel -->
  <rect x="540" y="100" width="470" height="440" rx="14" fill="url(#gAdd)" opacity="0.10" filter="url(#shadow)"/>
  <rect x="540" y="100" width="470" height="40" rx="14" fill="url(#gAdd)" opacity="0.95"/>
  <text x="775" y="126" text-anchor="middle" font-size="15" font-weight="bold" fill="white">🧠  Mem0 Memory Layer</text>

  <!-- memory.add() -->
  <g><rect x="570" y="165" width="200" height="120" rx="12" fill="url(#gAdd)" opacity="0.92" filter="url(#soft)"/><text x="670" y="193" text-anchor="middle" font-size="14" font-weight="bold" fill="white">memory.add()</text><text x="670" y="215" text-anchor="middle" font-size="11" fill="#d1fae5">LLM extraction</text><text x="670" y="233" text-anchor="middle" font-size="11" fill="#d1fae5">Conflict resolution</text><text x="670" y="251" text-anchor="middle" font-size="11" fill="#d1fae5">Deduplication</text><text x="670" y="269" text-anchor="middle" font-size="11" fill="#d1fae5">Auto-tagging</text></g>

  <!-- memory.search() -->
  <g><rect x="790" y="165" width="200" height="120" rx="12" fill="url(#gSearch)" opacity="0.92" filter="url(#soft)"/><text x="890" y="193" text-anchor="middle" font-size="14" font-weight="bold" fill="white">memory.search()</text><text x="890" y="215" text-anchor="middle" font-size="11" fill="#fff7ed">Semantic search</text><text x="890" y="233" text-anchor="middle" font-size="11" fill="#fff7ed">Ranked results</text><text x="890" y="251" text-anchor="middle" font-size="11" fill="#fff7ed">Scope filtering</text><text x="890" y="269" text-anchor="middle" font-size="11" fill="#fff7ed">(user_id, agent_id)</text></g>

  <!-- Vector Store (drum shape) -->
  <g>
    <ellipse cx="775" cy="340" rx="130" ry="28" fill="url(#gStore)" opacity="0.95" filter="url(#shadow)"/>
    <rect x="645" y="340" width="260" height="110" fill="url(#gStore)" opacity="0.95"/>
    <ellipse cx="775" cy="450" rx="130" ry="28" fill="url(#gStore)" opacity="0.95"/>
    <ellipse cx="775" cy="340" rx="130" ry="28" fill="none" stroke="#312e81" stroke-width="1"/>
    <text x="775" y="388" text-anchor="middle" font-size="14" font-weight="bold" fill="white">🗄  Qdrant Vector Store</text>
    <text x="775" y="410" text-anchor="middle" font-size="11" fill="#ede9fe">Embeddings + Metadata</text>
    <text x="775" y="428" text-anchor="middle" font-size="11" fill="#ede9fe">User scopes + Timestamps</text>
  </g>

  <!-- Management panel -->
  <rect x="1060" y="100" width="300" height="200" rx="14" fill="url(#gOps)" opacity="0.12" filter="url(#shadow)"/>
  <rect x="1060" y="100" width="300" height="40" rx="14" fill="url(#gOps)" opacity="0.95"/>
  <text x="1210" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="white">🔧  Management</text>

  <g><rect x="1090" y="160" width="240" height="50" rx="12" fill="white" filter="url(#soft)"/><text x="1210" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">memory.get_all(user_id)</text><text x="1210" y="200" text-anchor="middle" font-size="10" fill="#6b7280">list all memories for a user</text></g>
  <g><rect x="1090" y="220" width="240" height="30" rx="12" fill="white" filter="url(#soft)"/><text x="1210" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">memory.update(id, data)</text></g>
  <g><rect x="1090" y="260" width="240" height="30" rx="12" fill="white" filter="url(#soft)"/><text x="1210" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">memory.delete(id)</text></g>

  <!-- Arrows: User -> Agent -->
  <line x1="160" y1="220" x2="160" y2="258" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrMain)"/>
  <!-- Agent -> Response -->
  <line x1="160" y1="330" x2="160" y2="368" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrMain)"/>

  <!-- User -> memory.add (conversation turns) -->
  <path d="M 250 190 Q 420 160 568 210" stroke="#059669" stroke-width="2.5" fill="none" marker-end="url(#arrAdd)"/>
  <rect x="360" y="148" width="130" height="20" rx="6" fill="white" stroke="#059669"/><text x="425" y="163" text-anchor="middle" font-size="10" font-weight="bold" fill="#047857">conversation turns</text>

  <!-- memory.add -> Vector Store -->
  <path d="M 670 285 L 700 310" stroke="#059669" stroke-width="2.5" fill="none" marker-end="url(#arrAdd)"/>
  <rect x="635" y="290" width="90" height="18" rx="6" fill="white" stroke="#059669"/><text x="680" y="303" text-anchor="middle" font-size="10" font-weight="bold" fill="#047857">extracted facts</text>

  <!-- User -> memory.search (query) -->
  <path d="M 250 175 Q 600 90 860 163" stroke="#d97706" stroke-width="2.5" fill="none" marker-end="url(#arrSearch)"/>
  <rect x="520" y="82" width="60" height="18" rx="6" fill="white" stroke="#d97706"/><text x="550" y="95" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">query</text>

  <!-- memory.search -> Agent (relevant memories) -->
  <path d="M 790 225 Q 500 230 452 270" stroke="#d946ef" stroke-width="2.5" fill="none" marker-end="url(#arrResult)"/>
  <rect x="530" y="220" width="125" height="18" rx="6" fill="white" stroke="#d946ef"/><text x="593" y="233" text-anchor="middle" font-size="10" font-weight="bold" fill="#a21caf">relevant memories</text>

  <!-- Vector Store <-> memory.search -->
  <path d="M 850 340 Q 880 310 870 288" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#arrStore)"/>
  <path d="M 890 288 Q 910 320 910 340" stroke="#d97706" stroke-width="2" fill="none" marker-end="url(#arrSearch)"/>

  <!-- Management <-> Vector Store -->
  <path d="M 1060 260 Q 940 360 908 380" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrStore)"/>

  <!-- Legend -->
  <g>
    <line x1="40" y1="610" x2="70" y2="610" stroke="#059669" stroke-width="2.5" marker-end="url(#arrAdd)"/><text x="80" y="614" font-size="11" fill="#374151">memory.add() flow</text>
    <line x1="260" y1="610" x2="290" y2="610" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrSearch)"/><text x="300" y="614" font-size="11" fill="#374151">memory.search() flow</text>
    <line x1="490" y1="610" x2="520" y2="610" stroke="#d946ef" stroke-width="2.5" marker-end="url(#arrResult)"/><text x="530" y="614" font-size="11" fill="#374151">returned memories</text>
    <line x1="710" y1="610" x2="740" y2="610" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrStore)"/><text x="750" y="614" font-size="11" fill="#374151">management ops</text>
  </g>

  <text x="700" y="655" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">Mem0 handles extraction and deduplication automatically. The app only calls add() and search() with a user scope.</text>
</svg>