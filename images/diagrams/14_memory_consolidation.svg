<svg viewBox="0 0 1400 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="gPre" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#FFB75E"/><stop offset="100%" style="stop-color:#ED8F03"/></linearGradient>
    <linearGradient id="gTrig" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#ef4444"/><stop offset="100%" style="stop-color:#f97316"/></linearGradient>
    <linearGradient id="gCE" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#4facfe"/><stop offset="100%" style="stop-color:#00f2fe"/></linearGradient>
    <linearGradient id="gMD" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#667eea"/><stop offset="100%" style="stop-color:#764ba2"/></linearGradient>
    <linearGradient id="gCR" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#a855f7"/><stop offset="100%" style="stop-color:#d946ef"/></linearGradient>
    <linearGradient id="gIS" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#2196F3"/><stop offset="100%" style="stop-color:#21CBF3"/></linearGradient>
    <linearGradient id="gCS" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#11998e"/><stop offset="100%" style="stop-color:#38ef7d"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="1.5" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.18"/></filter>
    <filter id="soft"><feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.12"/></filter>
    <marker id="arrMain" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#2563eb"/></marker>
    <marker id="arrTrig" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#dc2626"/></marker>
  </defs>

  <rect width="1400" height="560" fill="#f8f9fa"/>
  <text x="700" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f2937">Memory Consolidation</text>
  <text x="700" y="62" text-anchor="middle" font-size="13" fill="#6b7280">Periodically cluster related memories, merge duplicates, resolve conflicts, score importance. Replace noisy raw memory with a clean store.</text>

  <!-- Trigger callout (top) -->
  <g><rect x="460" y="100" width="480" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,4" filter="url(#soft)"/><text x="700" y="124" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">🚨  Consolidation Trigger</text><text x="700" y="144" text-anchor="middle" font-size="11" fill="#7f1d1d">size threshold  ·  time interval  ·  manual command</text></g>

  <!-- Pipeline nodes -->
  <g><rect x="40" y="240" width="170" height="110" rx="14" fill="url(#gPre)" opacity="0.18" filter="url(#shadow)"/><rect x="40" y="240" width="170" height="36" rx="14" fill="url(#gPre)" opacity="0.95"/><text x="125" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="white">📦  Memory Store</text><text x="125" y="298" text-anchor="middle" font-size="11" fill="#1f2937">pre-consolidation</text><text x="125" y="316" text-anchor="middle" font-size="11" fill="#1f2937">noisy, duplicated,</text><text x="125" y="334" text-anchor="middle" font-size="11" fill="#1f2937">possibly conflicting</text></g>

  <g><rect x="250" y="240" width="180" height="110" rx="14" fill="url(#gCE)" opacity="0.18" filter="url(#shadow)"/><rect x="250" y="240" width="180" height="36" rx="14" fill="url(#gCE)" opacity="0.95"/><text x="340" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="white">🧲  Cluster Engine</text><text x="340" y="298" text-anchor="middle" font-size="11" fill="#1f2937">group by similarity</text><text x="340" y="316" text-anchor="middle" font-size="11" fill="#1f2937">(embeddings + topic)</text></g>

  <g><rect x="470" y="240" width="180" height="110" rx="14" fill="url(#gMD)" opacity="0.18" filter="url(#shadow)"/><rect x="470" y="240" width="180" height="36" rx="14" fill="url(#gMD)" opacity="0.95"/><text x="560" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="white">🔗  Merge &amp; Dedup</text><text x="560" y="298" text-anchor="middle" font-size="11" fill="#1f2937">collapse repeats</text><text x="560" y="316" text-anchor="middle" font-size="11" fill="#1f2937">into one canonical</text><text x="560" y="334" text-anchor="middle" font-size="11" fill="#1f2937">memory per cluster</text></g>

  <g><rect x="690" y="240" width="180" height="110" rx="14" fill="url(#gCR)" opacity="0.18" filter="url(#shadow)"/><rect x="690" y="240" width="180" height="36" rx="14" fill="url(#gCR)" opacity="0.95"/><text x="780" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="white">⚖  Conflict Resolver</text><text x="780" y="298" text-anchor="middle" font-size="11" fill="#1f2937">newer beats older</text><text x="780" y="316" text-anchor="middle" font-size="11" fill="#1f2937">higher confidence wins</text></g>

  <g><rect x="910" y="240" width="180" height="110" rx="14" fill="url(#gIS)" opacity="0.18" filter="url(#shadow)"/><rect x="910" y="240" width="180" height="36" rx="14" fill="url(#gIS)" opacity="0.95"/><text x="1000" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="white">⭐  Importance Scorer</text><text x="1000" y="298" text-anchor="middle" font-size="11" fill="#1f2937">drops low-value</text><text x="1000" y="316" text-anchor="middle" font-size="11" fill="#1f2937">memories, keeps</text><text x="1000" y="334" text-anchor="middle" font-size="11" fill="#1f2937">the ones that matter</text></g>

  <g><rect x="1130" y="240" width="220" height="110" rx="14" fill="url(#gCS)" opacity="0.18" filter="url(#shadow)"/><rect x="1130" y="240" width="220" height="36" rx="14" fill="url(#gCS)" opacity="0.95"/><text x="1240" y="263" text-anchor="middle" font-size="13" font-weight="bold" fill="white">✅  Consolidated Store</text><text x="1240" y="298" text-anchor="middle" font-size="11" fill="#1f2937">clean, deduplicated,</text><text x="1240" y="316" text-anchor="middle" font-size="11" fill="#1f2937">ranked by importance</text><text x="1240" y="334" text-anchor="middle" font-size="11" fill="#065f46" font-style="italic">ready for retrieval</text></g>

  <!-- arrows -->
  <line x1="212" y1="295" x2="248" y2="295" stroke="#2563eb" stroke-width="3" marker-end="url(#arrMain)"/>
  <line x1="432" y1="295" x2="468" y2="295" stroke="#2563eb" stroke-width="3" marker-end="url(#arrMain)"/>
  <line x1="652" y1="295" x2="688" y2="295" stroke="#2563eb" stroke-width="3" marker-end="url(#arrMain)"/>
  <line x1="872" y1="295" x2="908" y2="295" stroke="#2563eb" stroke-width="3" marker-end="url(#arrMain)"/>
  <line x1="1092" y1="295" x2="1128" y2="295" stroke="#2563eb" stroke-width="3" marker-end="url(#arrMain)"/>

  <!-- Trigger arrow to Cluster Engine -->
  <path d="M 700 156 Q 700 200 340 238" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrTrig)"/>

  <!-- Annotations under pipeline -->
  <text x="700" y="420" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">Consolidation runs off the critical path. The pre-store keeps accepting writes while a background job produces the next consolidated snapshot.</text>

  <g>
    <rect x="360" y="460" width="680" height="60" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5" filter="url(#soft)"/>
    <text x="700" y="482" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">💡  Why bother?</text>
    <text x="700" y="504" text-anchor="middle" font-size="12" fill="#78350f">Raw memory accumulates noise. Consolidated memory gives retrieval fewer, better items and keeps the store from blowing up.</text>
  </g>
</svg>
