<svg viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="gUser" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#667eea"/><stop offset="100%" style="stop-color:#764ba2"/></linearGradient>
    <linearGradient id="gBuf" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#2196F3"/><stop offset="100%" style="stop-color:#21CBF3"/></linearGradient>
    <linearGradient id="gLLM" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#f093fb"/><stop offset="100%" style="stop-color:#f5576c"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="1.5" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.18"/></filter>
    <filter id="soft"><feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.12"/></filter>
    <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#2563eb"/></marker>
    <marker id="arrPink" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#d946ef"/></marker>
    <marker id="arrSelf" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 L3,4.5 Z" fill="#0ea5e9"/></marker>
  </defs>

  <rect width="1200" height="820" fill="#f8f9fa"/>
  <text x="600" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f2937">Sliding Window Memory (k=4)</text>
  <text x="600" y="62" text-anchor="middle" font-size="13" fill="#6b7280">Keep only the last k messages. Older messages fall off the edge and are forgotten.</text>

  <g><rect x="120" y="90" width="180" height="62" rx="14" fill="url(#gUser)" opacity="0.92" filter="url(#shadow)"/><text x="210" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="white">👤  User</text><text x="210" y="140" text-anchor="middle" font-size="12" fill="#e9e3ff">Alice</text></g>
  <g><rect x="510" y="90" width="180" height="62" rx="14" fill="url(#gBuf)" opacity="0.92" filter="url(#shadow)"/><text x="600" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="white">🪟  Sliding Window</text><text x="600" y="140" text-anchor="middle" font-size="12" fill="#dff5ff">k = 4 messages</text></g>
  <g><rect x="900" y="90" width="180" height="62" rx="14" fill="url(#gLLM)" opacity="0.92" filter="url(#shadow)"/><text x="990" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="white">✨  LLM</text><text x="990" y="140" text-anchor="middle" font-size="12" fill="#ffe4f1">Claude</text></g>

  <line x1="210" y1="152" x2="210" y2="720" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="600" y1="152" x2="600" y2="720" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="990" y1="152" x2="990" y2="720" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Phase 1: filling -->
  <rect x="80" y="172" width="1040" height="160" rx="10" fill="#eef2ff" opacity="0.55"/>
  <text x="100" y="194" font-size="12" font-weight="bold" fill="#4f46e5" letter-spacing="1.5">PHASE 1 · FILLING THE WINDOW</text>

  <line x1="212" y1="218" x2="598" y2="218" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <rect x="300" y="200" width="220" height="24" rx="6" fill="white" filter="url(#soft)"/><text x="410" y="217" text-anchor="middle" font-size="12" fill="#1f2937">msg1: "Hi, I'm Alice"</text>
  <line x1="602" y1="252" x2="988" y2="252" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <rect x="720" y="234" width="150" height="24" rx="6" fill="white" filter="url(#soft)"/><text x="795" y="251" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">[msg1]</text>
  <line x1="988" y1="284" x2="602" y2="284" stroke="#d946ef" stroke-width="2.5" stroke-dasharray="7,4" marker-end="url(#arrPink)"/>
  <rect x="720" y="266" width="150" height="24" rx="6" fill="white" filter="url(#soft)"/><text x="795" y="283" text-anchor="middle" font-size="12" fill="#1f2937">msg2: response</text>

  <!-- window state pill -->
  <g transform="translate(300, 296)">
    <rect x="0" y="0" width="240" height="28" rx="14" fill="white" stroke="#22c55e" stroke-width="1.5" filter="url(#soft)"/>
    <text x="10" y="18" font-size="11" font-weight="bold" fill="#15803d">Window:</text>
    <rect x="62" y="5" width="34" height="18" rx="4" fill="#dcfce7" stroke="#22c55e"/><text x="79" y="18" text-anchor="middle" font-size="10" fill="#15803d">msg1</text>
    <rect x="100" y="5" width="34" height="18" rx="4" fill="#dcfce7" stroke="#22c55e"/><text x="117" y="18" text-anchor="middle" font-size="10" fill="#15803d">msg2</text>
    <rect x="138" y="5" width="34" height="18" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="2,2"/><text x="155" y="18" text-anchor="middle" font-size="10" fill="#64748b">—</text>
    <rect x="176" y="5" width="34" height="18" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="2,2"/><text x="193" y="18" text-anchor="middle" font-size="10" fill="#64748b">—</text>
  </g>

  <!-- Phase 2: full + first eviction -->
  <rect x="80" y="348" width="1040" height="180" rx="10" fill="#fef3c7" opacity="0.55"/>
  <text x="100" y="370" font-size="12" font-weight="bold" fill="#a16207" letter-spacing="1.5">PHASE 2 · WINDOW FULL · FIRST EVICTION</text>

  <line x1="212" y1="396" x2="598" y2="396" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <rect x="290" y="378" width="240" height="24" rx="6" fill="white" filter="url(#soft)"/><text x="410" y="395" text-anchor="middle" font-size="12" fill="#1f2937">msg5: "What's my name?"</text>

  <path d="M 612 420 C 680 420 680 444 612 444" fill="none" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrSelf)"/>
  <rect x="660" y="416" width="280" height="24" rx="6" fill="white" stroke="#ef4444" stroke-width="1.5" filter="url(#soft)"/>
  <text x="800" y="433" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">⚠ evict msg1, append msg5</text>

  <line x1="602" y1="472" x2="988" y2="472" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <rect x="680" y="454" width="230" height="24" rx="6" fill="white" filter="url(#soft)"/><text x="795" y="471" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">[msg2, msg3, msg4, msg5]</text>

  <g transform="translate(300, 496)">
    <rect x="0" y="0" width="240" height="28" rx="14" fill="white" stroke="#f59e0b" stroke-width="1.5" filter="url(#soft)"/>
    <text x="10" y="18" font-size="11" font-weight="bold" fill="#92400e">Window:</text>
    <rect x="62" y="5" width="34" height="18" rx="4" fill="#fef3c7" stroke="#f59e0b"/><text x="79" y="18" text-anchor="middle" font-size="10" fill="#92400e">msg2</text>
    <rect x="100" y="5" width="34" height="18" rx="4" fill="#fef3c7" stroke="#f59e0b"/><text x="117" y="18" text-anchor="middle" font-size="10" fill="#92400e">msg3</text>
    <rect x="138" y="5" width="34" height="18" rx="4" fill="#fef3c7" stroke="#f59e0b"/><text x="155" y="18" text-anchor="middle" font-size="10" fill="#92400e">msg4</text>
    <rect x="176" y="5" width="34" height="18" rx="4" fill="#fef3c7" stroke="#f59e0b"/><text x="193" y="18" text-anchor="middle" font-size="10" fill="#92400e">msg5</text>
  </g>

  <!-- Phase 3: later -->
  <rect x="80" y="544" width="1040" height="148" rx="10" fill="#fce7f3" opacity="0.55"/>
  <text x="100" y="566" font-size="12" font-weight="bold" fill="#be185d" letter-spacing="1.5">PHASE 3 · FACT HAS ALREADY SLID OUT</text>

  <line x1="212" y1="594" x2="598" y2="594" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrBlue)"/>
  <rect x="270" y="576" width="280" height="24" rx="6" fill="white" filter="url(#soft)"/><text x="410" y="593" text-anchor="middle" font-size="12" fill="#1f2937">"What language do I like?"</text>
  <line x1="988" y1="626" x2="602" y2="626" stroke="#d946ef" stroke-width="2.5" stroke-dasharray="7,4" marker-end="url(#arrPink)"/>
  <rect x="640" y="608" width="310" height="24" rx="6" fill="white" filter="url(#soft)"/><text x="795" y="625" text-anchor="middle" font-size="12" fill="#1f2937">"I don't have that information."</text>

  <g transform="translate(300, 650)">
    <rect x="0" y="0" width="280" height="28" rx="14" fill="white" stroke="#be185d" stroke-width="1.5" filter="url(#soft)"/>
    <text x="10" y="18" font-size="11" font-weight="bold" fill="#9f1239">"I like Python" (msg3) is gone</text>
  </g>

  <g>
    <rect x="270" y="714" width="660" height="58" rx="10" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5" filter="url(#soft)"/>
    <text x="600" y="736" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">⚠  Fixed size, constant cost. Older facts are lost.</text>
    <text x="600" y="756" text-anchor="middle" font-size="12" fill="#78350f">Token cost stops growing once the window is full, but any detail older than k turns is forgotten.</text>
  </g>

  <g>
    <line x1="80" y1="792" x2="110" y2="792" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrBlue)"/><text x="120" y="796" font-size="11" fill="#374151">request</text>
    <line x1="200" y1="792" x2="230" y2="792" stroke="#d946ef" stroke-width="2.5" stroke-dasharray="7,4" marker-end="url(#arrPink)"/><text x="240" y="796" font-size="11" fill="#374151">response</text>
    <path d="M 320 792 C 335 792 335 804 320 804" fill="none" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrSelf)"/><text x="350" y="796" font-size="11" fill="#374151">eviction + append (local)</text>
  </g>
</svg>
