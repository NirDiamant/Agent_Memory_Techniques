<svg viewBox="0 0 1400 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="gApp" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#667eea"/><stop offset="100%" style="stop-color:#764ba2"/></linearGradient>
    <linearGradient id="gZep" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#2196F3"/><stop offset="100%" style="stop-color:#21CBF3"/></linearGradient>
    <linearGradient id="gPipe" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#11998e"/><stop offset="100%" style="stop-color:#38ef7d"/></linearGradient>
    <linearGradient id="gStore" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#4f46e5"/><stop offset="100%" style="stop-color:#7c3aed"/></linearGradient>
    <linearGradient id="gSearch" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#FFB75E"/><stop offset="100%" style="stop-color:#ED8F03"/></linearGradient>
    <linearGradient id="gGraph" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#f093fb"/><stop offset="100%" style="stop-color:#f5576c"/></linearGradient>
    <linearGradient id="gCtx" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#4facfe"/><stop offset="100%" style="stop-color:#00f2fe"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="1.5" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.18"/></filter>
    <filter id="soft"><feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.12"/></filter>
    <marker id="arrMain" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#2563eb"/></marker>
    <marker id="arrPipe" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#059669"/></marker>
    <marker id="arrSearch" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#d97706"/></marker>
    <marker id="arrGraph" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#7c3aed"/></marker>
    <marker id="arrResp" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#d946ef"/></marker>
  </defs>

  <rect width="1400" height="720" fill="#f8f9fa"/>
  <text x="700" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f2937">Zep Memory Architecture</text>
  <text x="700" y="62" text-anchor="middle" font-size="13" fill="#6b7280">Managed memory service with async pipelines for entity/fact extraction, knowledge graph building, and hybrid search.</text>

  <!-- Agent Application panel (left) -->
  <rect x="30" y="90" width="300" height="580" rx="14" fill="url(#gApp)" opacity="0.12" filter="url(#shadow)"/>
  <rect x="30" y="90" width="300" height="44" rx="14" fill="url(#gApp)" opacity="0.95"/>
  <text x="180" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="white">🤖  Agent Application</text>

  <!-- User Messages -->
  <g><rect x="60" y="160" width="240" height="60" rx="12" fill="white" filter="url(#soft)"/><text x="180" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">👤  User Messages</text><text x="180" y="203" text-anchor="middle" font-size="11" fill="#6b7280">conversation turns</text></g>

  <!-- Zep SDK add -->
  <g><rect x="60" y="250" width="240" height="60" rx="12" fill="url(#gZep)" opacity="0.9" filter="url(#soft)"/><text x="180" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="white">📤  Zep SDK (add_message)</text><text x="180" y="293" text-anchor="middle" font-size="11" fill="#e0f2fe">sends turns to Zep</text></g>

  <!-- Zep SDK search -->
  <g><rect x="60" y="490" width="240" height="60" rx="12" fill="url(#gZep)" opacity="0.9" filter="url(#soft)"/><text x="180" y="515" text-anchor="middle" font-size="13" font-weight="bold" fill="white">🔍  Zep SDK (search)</text><text x="180" y="533" text-anchor="middle" font-size="11" fill="#e0f2fe">retrieves relevant memories</text></g>

  <!-- Agent Context Window -->
  <g><rect x="60" y="580" width="240" height="60" rx="12" fill="url(#gCtx)" opacity="0.9" filter="url(#soft)"/><text x="180" y="605" text-anchor="middle" font-size="13" font-weight="bold" fill="white">🧩  Agent Context Window</text><text x="180" y="623" text-anchor="middle" font-size="11" fill="#e0f2fe">enriched prompt</text></g>

  <!-- Zep Service panel (right) -->
  <rect x="380" y="90" width="990" height="580" rx="14" fill="url(#gZep)" opacity="0.10" filter="url(#shadow)"/>
  <rect x="380" y="90" width="990" height="44" rx="14" fill="url(#gZep)" opacity="0.95"/>
  <text x="875" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="white">☁  Zep Service (Managed)</text>

  <!-- Message Store -->
  <g><rect x="410" y="160" width="200" height="70" rx="12" fill="white" filter="url(#soft)"/><text x="510" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">💬  Message Store</text><text x="510" y="208" text-anchor="middle" font-size="11" fill="#6b7280">raw conversation log</text></g>

  <!-- Async Processing sub-panel -->
  <rect x="410" y="260" width="540" height="200" rx="14" fill="url(#gPipe)" opacity="0.12" filter="url(#shadow)"/>
  <rect x="410" y="260" width="540" height="38" rx="14" fill="url(#gPipe)" opacity="0.95"/>
  <text x="680" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="white">⚡  Async Background Pipelines</text>

  <!-- Pipeline nodes -->
  <g><rect x="430" y="316" width="230" height="56" rx="12" fill="url(#gPipe)" opacity="0.9" filter="url(#soft)"/><text x="545" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="white">🏷  Dialog Classifier</text><text x="545" y="357" text-anchor="middle" font-size="11" fill="#d1fae5">intent + topic labels</text></g>

  <g><rect x="430" y="390" width="230" height="56" rx="12" fill="url(#gPipe)" opacity="0.9" filter="url(#soft)"/><text x="545" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="white">🔎  Entity Extractor</text><text x="545" y="431" text-anchor="middle" font-size="11" fill="#d1fae5">people, places, things</text></g>

  <g><rect x="700" y="316" width="230" height="56" rx="12" fill="url(#gPipe)" opacity="0.9" filter="url(#soft)"/><text x="815" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="white">📋  Fact Extractor</text><text x="815" y="357" text-anchor="middle" font-size="11" fill="#d1fae5">structured claims</text></g>

  <g><rect x="700" y="390" width="230" height="56" rx="12" fill="url(#gGraph)" opacity="0.9" filter="url(#soft)"/><text x="815" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="white">🕸  Knowledge Graph (Graphiti)</text><text x="815" y="431" text-anchor="middle" font-size="11" fill="#ffe4f1">entity-relation triples</text></g>

  <!-- Zep Storage DB -->
  <g>
    <ellipse cx="1170" cy="280" rx="120" ry="26" fill="url(#gStore)" opacity="0.95" filter="url(#shadow)"/>
    <rect x="1050" y="280" width="240" height="100" fill="url(#gStore)" opacity="0.95"/>
    <ellipse cx="1170" cy="380" rx="120" ry="26" fill="url(#gStore)" opacity="0.95"/>
    <ellipse cx="1170" cy="280" rx="120" ry="26" fill="none" stroke="#312e81" stroke-width="1"/>
    <text x="1170" y="320" text-anchor="middle" font-size="14" font-weight="bold" fill="white">🗄  Zep Storage</text>
    <text x="1170" y="340" text-anchor="middle" font-size="11" fill="#ede9fe">Messages + Facts</text>
    <text x="1170" y="358" text-anchor="middle" font-size="11" fill="#ede9fe">Entities + Graph</text>
  </g>

  <!-- Search API sub-panel -->
  <rect x="980" y="430" width="380" height="110" rx="14" fill="url(#gSearch)" opacity="0.14" filter="url(#shadow)"/>
  <rect x="980" y="430" width="380" height="38" rx="14" fill="url(#gSearch)" opacity="0.95"/>
  <text x="1170" y="455" text-anchor="middle" font-size="14" font-weight="bold" fill="white">🔎  Search API</text>

  <g><rect x="1000" y="484" width="340" height="44" rx="12" fill="white" filter="url(#soft)"/><text x="1170" y="510" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">Semantic Search + Graph Traversal + Temporal Filter</text></g>

  <!-- ARROWS -->
  <!-- User Messages -> Zep SDK add -->
  <line x1="180" y1="222" x2="180" y2="248" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrMain)"/>
  <!-- Zep SDK add -> Message Store -->
  <path d="M 300 280 L 408 200" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrMain)"/>
  <!-- Message Store -> Pipelines -->
  <line x1="510" y1="232" x2="510" y2="258" stroke="#059669" stroke-width="2.5" marker-end="url(#arrPipe)"/>
  <rect x="518" y="236" width="50" height="20" rx="6" fill="white" stroke="#059669"/><text x="543" y="251" text-anchor="middle" font-size="10" font-weight="bold" fill="#047857">async</text>

  <!-- Pipelines -> Storage -->
  <path d="M 930 344 L 1048 310" stroke="#059669" stroke-width="2.5" fill="none" marker-end="url(#arrPipe)"/>
  <path d="M 930 420 L 1048 370" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#arrGraph)"/>

  <!-- Storage -> Search API -->
  <line x1="1170" y1="408" x2="1170" y2="428" stroke="#d97706" stroke-width="2.5" marker-end="url(#arrSearch)"/>

  <!-- Search API -> Zep SDK search -->
  <path d="M 980 510 Q 600 510 302 520" stroke="#d946ef" stroke-width="2.5" fill="none" marker-end="url(#arrResp)"/>
  <rect x="600" y="498" width="80" height="20" rx="6" fill="white" stroke="#d946ef"/><text x="640" y="513" text-anchor="middle" font-size="10" font-weight="bold" fill="#a21caf">results</text>

  <!-- Zep SDK search -> Context Window -->
  <line x1="180" y1="552" x2="180" y2="578" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrMain)"/>

  <!-- Legend -->
  <g>
    <line x1="40" y1="695" x2="70" y2="695" stroke="#2563eb" stroke-width="3" marker-end="url(#arrMain)"/><text x="80" y="699" font-size="11" fill="#374151">data flow</text>
    <line x1="200" y1="695" x2="230" y2="695" stroke="#059669" stroke-width="2.5" marker-end="url(#arrPipe)"/><text x="240" y="699" font-size="11" fill="#374151">async pipeline</text>
    <line x1="380" y1="695" x2="410" y2="695" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrGraph)"/><text x="420" y="699" font-size="11" fill="#374151">graph build</text>
    <line x1="540" y1="695" x2="570" y2="695" stroke="#d946ef" stroke-width="2.5" marker-end="url(#arrResp)"/><text x="580" y="699" font-size="11" fill="#374151">search results</text>
  </g>

  <text x="700" y="695" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">All extraction runs asynchronously after message storage. Search combines semantic, graph, and temporal signals.</text>
</svg>
