<svg viewBox="0 0 1400 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="gAgentA" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#667eea"/><stop offset="100%" style="stop-color:#764ba2"/></linearGradient>
    <linearGradient id="gAgentB" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#4facfe"/><stop offset="100%" style="stop-color:#00f2fe"/></linearGradient>
    <linearGradient id="gAgentC" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#f093fb"/><stop offset="100%" style="stop-color:#f5576c"/></linearGradient>
    <linearGradient id="gACL" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#4f46e5"/><stop offset="100%" style="stop-color:#7c3aed"/></linearGradient>
    <linearGradient id="gPool" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#11998e"/><stop offset="100%" style="stop-color:#38ef7d"/></linearGradient>
    <linearGradient id="gConflict" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#ef4444"/><stop offset="100%" style="stop-color:#b91c1c"/></linearGradient>
    <linearGradient id="gBB" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#FFB75E"/><stop offset="100%" style="stop-color:#ED8F03"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="1.5" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.18"/></filter>
    <filter id="soft"><feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.12"/></filter>
    <marker id="arrMain" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#2563eb"/></marker>
    <marker id="arrACL" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#7c3aed"/></marker>
    <marker id="arrOK" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#059669"/></marker>
    <marker id="arrErr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#dc2626"/></marker>
  </defs>

  <rect width="1400" height="720" fill="#f8f9fa"/>
  <text x="700" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f2937">Multi-Agent Shared Memory</text>
  <text x="700" y="62" text-anchor="middle" font-size="13" fill="#6b7280">Multiple agents share a namespaced memory pool. An access-control layer and conflict resolution keep writes consistent.</text>

  <!-- Agent A panel -->
  <rect x="40" y="100" width="260" height="200" rx="14" fill="url(#gAgentA)" opacity="0.12" filter="url(#shadow)"/>
  <rect x="40" y="100" width="260" height="38" rx="14" fill="url(#gAgentA)" opacity="0.95"/>
  <text x="170" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="white">🔬  Agent A (Researcher)</text>
  <g><rect x="65" y="155" width="210" height="55" rx="12" fill="white" filter="url(#soft)"/><text x="170" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">📋  Private Scratchpad</text><text x="170" y="196" text-anchor="middle" font-size="11" fill="#6b7280">drafts, notes, temp data</text></g>
  <g><rect x="65" y="225" width="210" height="55" rx="12" fill="url(#gAgentA)" opacity="0.9" filter="url(#soft)"/><text x="170" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="white">🧠  Local reasoning</text><text x="170" y="266" text-anchor="middle" font-size="10" fill="#e9e3ff">search, analyze, summarize</text></g>

  <!-- Agent B panel -->
  <rect x="340" y="100" width="260" height="200" rx="14" fill="url(#gAgentB)" opacity="0.12" filter="url(#shadow)"/>
  <rect x="340" y="100" width="260" height="38" rx="14" fill="url(#gAgentB)" opacity="0.95"/>
  <text x="470" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="white">💻  Agent B (Coder)</text>
  <g><rect x="365" y="155" width="210" height="55" rx="12" fill="white" filter="url(#soft)"/><text x="470" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">📋  Private Scratchpad</text><text x="470" y="196" text-anchor="middle" font-size="11" fill="#6b7280">code buffers, WIP diffs</text></g>
  <g><rect x="365" y="225" width="210" height="55" rx="12" fill="url(#gAgentB)" opacity="0.9" filter="url(#soft)"/><text x="470" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="white">🧠  Local reasoning</text><text x="470" y="266" text-anchor="middle" font-size="10" fill="#e0f7fa">implement, test, debug</text></g>

  <!-- Agent C panel -->
  <rect x="640" y="100" width="260" height="200" rx="14" fill="url(#gAgentC)" opacity="0.12" filter="url(#shadow)"/>
  <rect x="640" y="100" width="260" height="38" rx="14" fill="url(#gAgentC)" opacity="0.95"/>
  <text x="770" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="white">🔍  Agent C (Reviewer)</text>
  <g><rect x="665" y="155" width="210" height="55" rx="12" fill="white" filter="url(#soft)"/><text x="770" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">📋  Private Scratchpad</text><text x="770" y="196" text-anchor="middle" font-size="11" fill="#6b7280">review notes, issues</text></g>
  <g><rect x="665" y="225" width="210" height="55" rx="12" fill="url(#gAgentC)" opacity="0.9" filter="url(#soft)"/><text x="770" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="white">🧠  Local reasoning</text><text x="770" y="266" text-anchor="middle" font-size="10" fill="#ffe4f1">review, critique, approve</text></g>

  <!-- Access Control Layer -->
  <g><rect x="280" y="340" width="360" height="60" rx="14" fill="url(#gACL)" opacity="0.92" filter="url(#shadow)"/><text x="460" y="367" text-anchor="middle" font-size="14" font-weight="bold" fill="white">🔐  Access Control Layer</text><text x="460" y="387" text-anchor="middle" font-size="11" fill="#ede9fe">namespace permissions per agent</text></g>

  <!-- Arrows from agents to ACL -->
  <line x1="170" y1="300" x2="340" y2="348" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrACL)"/>
  <line x1="470" y1="300" x2="460" y2="338" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrACL)"/>
  <line x1="770" y1="300" x2="580" y2="348" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrACL)"/>

  <!-- Shared Memory Pool panel -->
  <rect x="40" y="440" width="860" height="180" rx="14" fill="url(#gPool)" opacity="0.12" filter="url(#shadow)"/>
  <rect x="40" y="440" width="860" height="40" rx="14" fill="url(#gPool)" opacity="0.95"/>
  <text x="470" y="466" text-anchor="middle" font-size="15" font-weight="bold" fill="white">📦  Shared Memory Pool</text>

  <!-- Namespace nodes -->
  <g><rect x="70" y="500" width="240" height="100" rx="12" fill="white" filter="url(#soft)"/><text x="190" y="530" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">🔬  research/</text><text x="190" y="552" text-anchor="middle" font-size="11" fill="#6b7280">findings, sources,</text><text x="190" y="568" text-anchor="middle" font-size="11" fill="#6b7280">literature summaries</text></g>
  <g><rect x="340" y="500" width="240" height="100" rx="12" fill="white" filter="url(#soft)"/><text x="460" y="530" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">💻  code/</text><text x="460" y="552" text-anchor="middle" font-size="11" fill="#6b7280">artifacts, specs,</text><text x="460" y="568" text-anchor="middle" font-size="11" fill="#6b7280">implementation plans</text></g>
  <g><rect x="610" y="500" width="240" height="100" rx="12" fill="white" filter="url(#soft)"/><text x="730" y="530" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">🔍  review/</text><text x="730" y="552" text-anchor="middle" font-size="11" fill="#6b7280">feedback, issues,</text><text x="730" y="568" text-anchor="middle" font-size="11" fill="#6b7280">approval status</text></g>

  <!-- ACL to Pool -->
  <path d="M 460 400 L 460 438" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrACL)"/>
  <rect x="410" y="408" width="100" height="22" rx="6" fill="white" stroke="#7c3aed"/><text x="460" y="424" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">read / write</text>

  <!-- Conflict Resolution panel -->
  <rect x="960" y="320" width="400" height="310" rx="14" fill="url(#gConflict)" opacity="0.12" filter="url(#shadow)"/>
  <rect x="960" y="320" width="400" height="40" rx="14" fill="url(#gConflict)" opacity="0.95"/>
  <text x="1160" y="346" text-anchor="middle" font-size="14" font-weight="bold" fill="white">⚠  Conflict Resolution</text>

  <g><rect x="990" y="380" width="340" height="55" rx="12" fill="white" filter="url(#soft)"/><text x="1160" y="403" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">🔀  Detect conflicting writes</text><text x="1160" y="421" text-anchor="middle" font-size="11" fill="#6b7280">same key, different agents, same window</text></g>
  <g><rect x="990" y="450" width="340" height="55" rx="12" fill="url(#gConflict)" opacity="0.9" filter="url(#soft)"/><text x="1160" y="473" text-anchor="middle" font-size="13" font-weight="bold" fill="white">⚖  Merge strategy</text><text x="1160" y="491" text-anchor="middle" font-size="11" fill="#fecaca">last-write-wins / priority / LLM merge</text></g>

  <!-- Blackboard -->
  <g><rect x="990" y="530" width="340" height="80" rx="14" fill="url(#gBB)" opacity="0.92" filter="url(#shadow)"/><text x="1160" y="560" text-anchor="middle" font-size="14" font-weight="bold" fill="white">📊  Blackboard</text><text x="1160" y="582" text-anchor="middle" font-size="11" fill="#fff7ed">partial solutions assembled</text><text x="1160" y="598" text-anchor="middle" font-size="11" fill="#fff7ed">from all agent contributions</text></g>

  <!-- Pool to Conflict Resolution -->
  <path d="M 900 550 L 988 430" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#arrErr)"/>
  <rect x="888" y="474" width="100" height="22" rx="6" fill="white" stroke="#dc2626"/><text x="938" y="490" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">conflicts</text>

  <!-- Conflict -> Blackboard -->
  <line x1="1160" y1="505" x2="1160" y2="528" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrMain)"/>

  <!-- Blackboard feedback to Pool -->
  <path d="M 990 590 Q 870 640 470 620" stroke="#059669" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrOK)"/>
  <rect x="680" y="636" width="170" height="22" rx="6" fill="white" stroke="#059669"/><text x="765" y="652" text-anchor="middle" font-size="11" font-weight="bold" fill="#047857">merged results back</text>

  <!-- Legend -->
  <g>
    <line x1="40" y1="690" x2="70" y2="690" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrACL)"/><text x="80" y="694" font-size="11" fill="#374151">agent access (read/write)</text>
    <line x1="280" y1="690" x2="310" y2="690" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrErr)"/><text x="320" y="694" font-size="11" fill="#374151">conflict detected</text>
    <line x1="500" y1="690" x2="530" y2="690" stroke="#059669" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrOK)"/><text x="540" y="694" font-size="11" fill="#374151">merged result</text>
  </g>

  <text x="700" y="715" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">Each agent reads the full pool but writes only to its own namespace. The blackboard aggregates partial solutions into a coherent whole.</text>
</svg>