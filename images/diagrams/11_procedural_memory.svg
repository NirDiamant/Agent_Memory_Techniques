<svg viewBox="0 0 1400 580" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="gIn" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#667eea"/><stop offset="100%" style="stop-color:#764ba2"/></linearGradient>
    <linearGradient id="gDec" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#FFB75E"/><stop offset="100%" style="stop-color:#ED8F03"/></linearGradient>
    <linearGradient id="gExt" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#4facfe"/><stop offset="100%" style="stop-color:#00f2fe"/></linearGradient>
    <linearGradient id="gLib" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#4f46e5"/><stop offset="100%" style="stop-color:#7c3aed"/></linearGradient>
    <linearGradient id="gExec" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#11998e"/><stop offset="100%" style="stop-color:#38ef7d"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="1.5" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.18"/></filter>
    <filter id="soft"><feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.12"/></filter>
    <marker id="arrMain" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#2563eb"/></marker>
    <marker id="arrNo" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#dc2626"/></marker>
    <marker id="arrYes" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#059669"/></marker>
  </defs>

  <rect width="1400" height="580" fill="#f8f9fa"/>
  <text x="700" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f2937">Procedural Memory</text>
  <text x="700" y="62" text-anchor="middle" font-size="13" fill="#6b7280">Learn reusable procedures from successful runs. At task time, retrieve the closest procedure and adapt its parameters.</text>

  <!-- Top row: learning path -->
  <rect x="30" y="100" width="1340" height="200" rx="14" fill="#eef2ff" opacity="0.5" filter="url(#shadow)"/>
  <text x="60" y="125" font-size="12" font-weight="bold" fill="#4f46e5" letter-spacing="1.5">LEARNING · FROM COMPLETED TASK TO STORED SKILL</text>

  <g><rect x="50" y="155" width="180" height="110" rx="12" fill="url(#gIn)" opacity="0.92" filter="url(#shadow)"/><text x="140" y="188" text-anchor="middle" font-size="14" font-weight="bold" fill="white">⚙  Task Execution</text><text x="140" y="210" text-anchor="middle" font-size="11" fill="#e9e3ff">step-by-step trace</text><text x="140" y="228" text-anchor="middle" font-size="11" fill="#e9e3ff">(actions + results)</text></g>

  <g><polygon points="280,210 400,165 520,210 400,255" fill="url(#gDec)" opacity="0.95" filter="url(#shadow)"/><text x="400" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Task</text><text x="400" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Succeeded?</text></g>

  <g><rect x="320" y="280" width="160" height="50" rx="12" fill="white" stroke="#dc2626" stroke-width="2" filter="url(#soft)"/><text x="400" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">🗑  Discard / Log</text><text x="400" y="318" text-anchor="middle" font-size="10" fill="#7f1d1d">save trace for debugging</text></g>

  <g><rect x="570" y="160" width="200" height="110" rx="12" fill="url(#gExt)" opacity="0.18" filter="url(#shadow)"/><rect x="570" y="160" width="200" height="36" rx="12" fill="url(#gExt)" opacity="0.95"/><text x="670" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="white">🧪  Procedure Extractor</text><text x="670" y="220" text-anchor="middle" font-size="11" fill="#1f2937">LLM call turns the</text><text x="670" y="238" text-anchor="middle" font-size="11" fill="#1f2937">trace into a general</text><text x="670" y="256" text-anchor="middle" font-size="11" fill="#1f2937">parameterized recipe</text></g>

  <g><rect x="820" y="160" width="190" height="110" rx="12" fill="white" filter="url(#soft)"/><text x="915" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">📄  Workflow Template</text><text x="915" y="214" text-anchor="middle" font-size="11" font-family="monospace" fill="#475569">1. {search query}</text><text x="915" y="232" text-anchor="middle" font-size="11" font-family="monospace" fill="#475569">2. filter by {date}</text><text x="915" y="250" text-anchor="middle" font-size="11" font-family="monospace" fill="#475569">3. summarize {topic}</text></g>

  <g><rect x="1060" y="160" width="220" height="110" rx="12" fill="url(#gLib)" opacity="0.18" filter="url(#shadow)"/><rect x="1060" y="160" width="220" height="36" rx="12" fill="url(#gLib)" opacity="0.95"/><text x="1170" y="184" text-anchor="middle" font-size="13" font-weight="bold" fill="white">📚  Skill Library</text><text x="1170" y="220" text-anchor="middle" font-size="11" fill="#1f2937">indexed by task type</text><text x="1170" y="238" text-anchor="middle" font-size="11" fill="#1f2937">many templates</text><text x="1170" y="256" text-anchor="middle" font-size="10" fill="#4b5563">grows with experience</text></g>

  <!-- arrows learning row -->
  <line x1="232" y1="210" x2="280" y2="210" stroke="#2563eb" stroke-width="3" marker-end="url(#arrMain)"/>
  <path d="M 400 255 L 400 278" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrNo)"/>
  <rect x="406" y="254" width="38" height="22" rx="6" fill="white" stroke="#dc2626"/><text x="425" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#dc2626">No</text>
  <line x1="520" y1="210" x2="568" y2="210" stroke="#059669" stroke-width="2.5" marker-end="url(#arrYes)"/>
  <rect x="524" y="184" width="44" height="22" rx="6" fill="white" stroke="#059669"/><text x="546" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#059669">Yes</text>
  <line x1="772" y1="215" x2="818" y2="215" stroke="#2563eb" stroke-width="3" marker-end="url(#arrMain)"/>
  <line x1="1012" y1="215" x2="1058" y2="215" stroke="#2563eb" stroke-width="3" marker-end="url(#arrMain)"/>

  <!-- Bottom row: execution path -->
  <rect x="30" y="340" width="1340" height="170" rx="14" fill="#ecfeff" opacity="0.7" filter="url(#shadow)"/>
  <text x="60" y="365" font-size="12" font-weight="bold" fill="#0891b2" letter-spacing="1.5">EXECUTION · REUSE A STORED SKILL ON A NEW TASK</text>

  <g><rect x="50" y="395" width="180" height="90" rx="12" fill="url(#gIn)" opacity="0.92" filter="url(#shadow)"/><text x="140" y="425" text-anchor="middle" font-size="14" font-weight="bold" fill="white">🆕  New Task</text><text x="140" y="448" text-anchor="middle" font-size="11" fill="#e9e3ff">"summarize last</text><text x="140" y="464" text-anchor="middle" font-size="11" fill="#e9e3ff">quarter's reports"</text></g>

  <g><rect x="280" y="395" width="220" height="90" rx="12" fill="url(#gExt)" opacity="0.9" filter="url(#shadow)"/><text x="390" y="425" text-anchor="middle" font-size="14" font-weight="bold" fill="white">🔎  Retrieval</text><text x="390" y="448" text-anchor="middle" font-size="11" fill="#e0f2fe">task-type matching</text><text x="390" y="464" text-anchor="middle" font-size="11" fill="#e0f2fe">(labels + embeddings)</text></g>

  <g><rect x="560" y="395" width="220" height="90" rx="12" fill="white" filter="url(#soft)"/><text x="670" y="425" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">🧩  Adaptation</text><text x="670" y="448" text-anchor="middle" font-size="11" fill="#6b7280">fill parameters</text><text x="670" y="464" text-anchor="middle" font-size="11" fill="#6b7280">for this specific task</text></g>

  <g><rect x="840" y="395" width="240" height="90" rx="12" fill="url(#gExec)" opacity="0.9" filter="url(#shadow)"/><text x="960" y="425" text-anchor="middle" font-size="14" font-weight="bold" fill="white">▶  Execute Procedure</text><text x="960" y="448" text-anchor="middle" font-size="11" fill="#d1fae5">run the steps in order</text><text x="960" y="464" text-anchor="middle" font-size="11" fill="#d1fae5">skip re-planning</text></g>

  <line x1="232" y1="440" x2="278" y2="440" stroke="#2563eb" stroke-width="3" marker-end="url(#arrMain)"/>
  <line x1="502" y1="440" x2="558" y2="440" stroke="#2563eb" stroke-width="3" marker-end="url(#arrMain)"/>
  <line x1="782" y1="440" x2="838" y2="440" stroke="#2563eb" stroke-width="3" marker-end="url(#arrMain)"/>
  <path d="M 1170 272 Q 1170 340 390 395" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrMain)"/>

  <text x="700" y="545" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">Procedural memory is how agents stop re-deriving the same plan every time.</text>
</svg>
