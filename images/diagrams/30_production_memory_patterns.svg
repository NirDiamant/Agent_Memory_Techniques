<svg viewBox="0 0 1400 720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="gIng" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#667eea"/><stop offset="100%" style="stop-color:#764ba2"/></linearGradient>
    <linearGradient id="gPII" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#11998e"/><stop offset="100%" style="stop-color:#38ef7d"/></linearGradient>
    <linearGradient id="gCost" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#FFB75E"/><stop offset="100%" style="stop-color:#ED8F03"/></linearGradient>
    <linearGradient id="gHot" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#ef4444"/><stop offset="100%" style="stop-color:#b91c1c"/></linearGradient>
    <linearGradient id="gWarm" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#f59e0b"/><stop offset="100%" style="stop-color:#d97706"/></linearGradient>
    <linearGradient id="gCold" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#2196F3"/><stop offset="100%" style="stop-color:#21CBF3"/></linearGradient>
    <linearGradient id="gGraph" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#4f46e5"/><stop offset="100%" style="stop-color:#7c3aed"/></linearGradient>
    <linearGradient id="gGuard" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#4facfe"/><stop offset="100%" style="stop-color:#00f2fe"/></linearGradient>
    <linearGradient id="gLLM" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#f093fb"/><stop offset="100%" style="stop-color:#f5576c"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="1.5" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.18"/></filter>
    <filter id="soft"><feDropShadow dx="1" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.12"/></filter>
    <marker id="arrMain" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#2563eb"/></marker>
    <marker id="arrDemote" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#ea580c"/></marker>
    <marker id="arrPromote" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#059669"/></marker>
    <marker id="arrGraph" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#7c3aed"/></marker>
    <marker id="arrGuard" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#0284c7"/></marker>
  </defs>

  <rect width="1400" height="720" fill="#f8f9fa"/>
  <text x="700" y="38" text-anchor="middle" font-size="24" font-weight="bold" fill="#1f2937">Production Memory Patterns</text>
  <text x="700" y="62" text-anchor="middle" font-size="13" fill="#6b7280">Ingestion pipeline with PII scanning, tiered hot/warm/cold storage with promote/demote, entity graph, and guardrails.</text>

  <!-- Ingestion Pipeline panel -->
  <rect x="30" y="90" width="360" height="420" rx="14" fill="url(#gIng)" opacity="0.12" filter="url(#shadow)"/>
  <rect x="30" y="90" width="360" height="44" rx="14" fill="url(#gIng)" opacity="0.95"/>
  <text x="210" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="white">📥  Memory Ingestion</text>

  <!-- New Message -->
  <g><rect x="65" y="155" width="280" height="50" rx="12" fill="white" filter="url(#soft)"/><text x="205" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">💬  New Message</text></g>

  <!-- PII Scanner -->
  <g><rect x="65" y="225" width="280" height="50" rx="12" fill="url(#gPII)" opacity="0.9" filter="url(#soft)"/><text x="205" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="white">🛡  PII Scanner and Redactor</text></g>

  <!-- Fact Extractor -->
  <g><rect x="65" y="295" width="280" height="50" rx="12" fill="url(#gLLM)" opacity="0.9" filter="url(#soft)"/><text x="205" y="325" text-anchor="middle" font-size="13" font-weight="bold" fill="white">✨  Fact Extractor (LLM)</text></g>

  <!-- Embedding Generator -->
  <g><rect x="65" y="365" width="280" height="50" rx="12" fill="white" filter="url(#soft)"/><text x="205" y="395" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">🧮  Embedding Generator</text></g>

  <!-- Cost Tracker -->
  <g><rect x="65" y="435" width="280" height="50" rx="12" fill="url(#gCost)" opacity="0.9" filter="url(#soft)"/><text x="205" y="462" text-anchor="middle" font-size="13" font-weight="bold" fill="white">💲  Cost Tracker ($ gate)</text></g>

  <!-- Ingestion arrows -->
  <line x1="205" y1="207" x2="205" y2="223" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrMain)"/>
  <line x1="205" y1="277" x2="205" y2="293" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrMain)"/>
  <line x1="205" y1="347" x2="205" y2="363" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrMain)"/>
  <line x1="205" y1="417" x2="205" y2="433" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrMain)"/>

  <!-- Tiered Storage panel -->
  <rect x="440" y="90" width="530" height="420" rx="14" fill="#fef2f2" opacity="0.4" filter="url(#shadow)"/>
  <rect x="440" y="90" width="530" height="44" rx="14" fill="url(#gHot)" opacity="0.85"/>
  <text x="705" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="white">🔥  Tiered Storage</text>

  <!-- Hot Tier -->
  <g><rect x="470" y="155" width="220" height="100" rx="12" fill="url(#gHot)" opacity="0.92" filter="url(#soft)"/><text x="580" y="182" text-anchor="middle" font-size="14" font-weight="bold" fill="white">🔴  Hot Tier</text><text x="580" y="202" text-anchor="middle" font-size="11" fill="#fee2e2">In-Memory / Redis</text><text x="580" y="220" text-anchor="middle" font-size="11" fill="#fee2e2">TTL: minutes-hours</text><text x="580" y="238" text-anchor="middle" font-size="11" fill="#fee2e2">Latency: &lt;1ms</text></g>

  <!-- Warm Tier -->
  <g><rect x="470" y="280" width="220" height="100" rx="12" fill="url(#gWarm)" opacity="0.92" filter="url(#soft)"/><text x="580" y="307" text-anchor="middle" font-size="14" font-weight="bold" fill="white">🟡  Warm Tier</text><text x="580" y="327" text-anchor="middle" font-size="11" fill="#fef3c7">Postgres + pgvector</text><text x="580" y="345" text-anchor="middle" font-size="11" fill="#fef3c7">TTL: days-months</text><text x="580" y="363" text-anchor="middle" font-size="11" fill="#fef3c7">Latency: 5-50ms</text></g>

  <!-- Cold Tier -->
  <g><rect x="470" y="405" width="220" height="100" rx="12" fill="url(#gCold)" opacity="0.92" filter="url(#soft)"/><text x="580" y="432" text-anchor="middle" font-size="14" font-weight="bold" fill="white">🔵  Cold Tier</text><text x="580" y="452" text-anchor="middle" font-size="11" fill="#e0f2fe">Compressed Archive</text><text x="580" y="470" text-anchor="middle" font-size="11" fill="#e0f2fe">TTL: indefinite</text><text x="580" y="488" text-anchor="middle" font-size="11" fill="#e0f2fe">Latency: 100ms+</text></g>

  <!-- Demote arrows (Hot->Warm, Warm->Cold) -->
  <path d="M 692 230 Q 730 255 692 278" stroke="#ea580c" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrDemote)"/>
  <rect x="720" y="243" width="90" height="20" rx="6" fill="white" stroke="#ea580c"/><text x="765" y="258" text-anchor="middle" font-size="10" font-weight="bold" fill="#c2410c">demote (TTL)</text>

  <path d="M 692 355 Q 730 380 692 403" stroke="#ea580c" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrDemote)"/>
  <rect x="720" y="368" width="110" height="20" rx="6" fill="white" stroke="#ea580c"/><text x="775" y="383" text-anchor="middle" font-size="10" font-weight="bold" fill="#c2410c">demote (low use)</text>

  <!-- Promote arrows (Cold->Warm, Warm->Hot) -->
  <path d="M 468 420 Q 430 385 468 355" stroke="#059669" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrPromote)"/>
  <rect x="840" y="395" width="120" height="20" rx="6" fill="white" stroke="#059669"/><text x="900" y="410" text-anchor="middle" font-size="10" font-weight="bold" fill="#047857">promote (re-use)</text>

  <path d="M 468 295 Q 430 260 468 230" stroke="#059669" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrPromote)"/>
  <rect x="840" y="265" width="120" height="20" rx="6" fill="white" stroke="#059669"/><text x="900" y="280" text-anchor="middle" font-size="10" font-weight="bold" fill="#047857">promote (hot)</text>

  <!-- Cost Tracker -> Hot Tier -->
  <path d="M 345 460 Q 400 360 468 205" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrMain)"/>

  <!-- Relationship Layer panel -->
  <rect x="1020" y="90" width="350" height="200" rx="14" fill="url(#gGraph)" opacity="0.12" filter="url(#shadow)"/>
  <rect x="1020" y="90" width="350" height="44" rx="14" fill="url(#gGraph)" opacity="0.95"/>
  <text x="1195" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="white">🕸  Relationship Layer</text>

  <!-- Entity Graph DB -->
  <g>
    <ellipse cx="1195" cy="175" rx="110" ry="22" fill="url(#gGraph)" opacity="0.95" filter="url(#shadow)"/>
    <rect x="1085" y="175" width="220" height="70" fill="url(#gGraph)" opacity="0.95"/>
    <ellipse cx="1195" cy="245" rx="110" ry="22" fill="url(#gGraph)" opacity="0.95"/>
    <ellipse cx="1195" cy="175" rx="110" ry="22" fill="none" stroke="#312e81" stroke-width="1"/>
    <text x="1195" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="white">🗄  Entity Graph</text>
    <text x="1195" y="230" text-anchor="middle" font-size="11" fill="#ede9fe">nodes, edges, traversal queries</text>
  </g>

  <!-- Fact Extractor -> Entity Graph -->
  <path d="M 345 320 Q 700 100 1083 200" stroke="#7c3aed" stroke-width="2.5" fill="none" marker-end="url(#arrGraph)"/>

  <!-- Guardrails panel -->
  <rect x="1020" y="330" width="350" height="180" rx="14" fill="url(#gGuard)" opacity="0.12" filter="url(#shadow)"/>
  <rect x="1020" y="330" width="350" height="44" rx="14" fill="url(#gGuard)" opacity="0.95"/>
  <text x="1195" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="white">🛡  Guardrails</text>

  <!-- Budget Enforcer -->
  <g><rect x="1040" y="390" width="150" height="50" rx="12" fill="white" filter="url(#soft)"/><text x="1115" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">💰  Budget</text><text x="1115" y="428" text-anchor="middle" font-size="10" fill="#6b7280">max tokens/count</text></g>

  <!-- Privacy Manager -->
  <g><rect x="1200" y="390" width="150" height="50" rx="12" fill="white" filter="url(#soft)"/><text x="1275" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">🔒  Privacy</text><text x="1275" y="428" text-anchor="middle" font-size="10" fill="#6b7280">GDPR / audit log</text></g>

  <!-- Observability -->
  <g><rect x="1120" y="455" width="150" height="50" rx="12" fill="white" filter="url(#soft)"/><text x="1195" y="477" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">📊  Observability</text><text x="1195" y="493" text-anchor="middle" font-size="10" fill="#6b7280">metrics / alerts</text></g>

  <!-- Tiers -> Guardrails -->
  <path d="M 692 205 Q 920 200 1038 410" stroke="#0284c7" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrGuard)"/>
  <path d="M 692 330 Q 920 330 1038 415" stroke="#0284c7" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrGuard)"/>
  <path d="M 692 455 Q 920 455 1038 430" stroke="#0284c7" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrGuard)"/>

  <!-- Legend -->
  <g>
    <line x1="40" y1="620" x2="70" y2="620" stroke="#2563eb" stroke-width="3" marker-end="url(#arrMain)"/><text x="80" y="624" font-size="11" fill="#374151">data flow</text>
    <line x1="200" y1="620" x2="230" y2="620" stroke="#ea580c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrDemote)"/><text x="240" y="624" font-size="11" fill="#374151">demote (cold)</text>
    <line x1="370" y1="620" x2="400" y2="620" stroke="#059669" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrPromote)"/><text x="410" y="624" font-size="11" fill="#374151">promote (hot)</text>
    <line x1="530" y1="620" x2="560" y2="620" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrGraph)"/><text x="570" y="624" font-size="11" fill="#374151">graph build</text>
    <line x1="670" y1="620" x2="700" y2="620" stroke="#0284c7" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrGuard)"/><text x="710" y="624" font-size="11" fill="#374151">guardrail checks</text>
  </g>

  <text x="700" y="695" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">PII scanning runs before any extraction. All tiers report to budget, privacy, and observability guardrails.</text>
</svg>
